<div class="min-h-screen bg-[#f3f5f1] text-[#202b27] lg:grid lg:grid-cols-[15rem_minmax(0,1fr)]">
	<aside class="border-b border-[#dce3dc] bg-white lg:sticky lg:top-0 lg:h-screen lg:border-b-0 lg:border-r">
		<a routerLink="/models/list" class="flex h-18 items-center gap-3 px-5" aria-label="MLOps home">
			<span class="grid size-9 place-items-center rounded-md bg-[#17644f] text-sm font-bold text-white">M</span>
			<span>
				<span class="block text-sm font-semibold">MLOps Platform</span>
				<span class="mt-0.5 block text-[10px] font-semibold uppercase tracking-[0.12em] text-[#718078]">Operations</span>
			</span>
		</a>

		<nav aria-label="Main navigation" class="flex gap-1 overflow-x-auto px-3 pb-3 lg:flex-col lg:gap-1 lg:py-5">
			<span class="hidden px-3 pb-2 text-[10px] font-semibold uppercase tracking-[0.12em] text-[#89958e] lg:block">Registry</span>
			<a routerLink="/models/list" routerLinkActive="bg-[#eaf1ec] text-[#17644f]" class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-[#56645c] transition-colors hover:bg-[#f1f4f0]">Models</a>
			<a routerLink="/models/register" routerLinkActive="bg-[#eaf1ec] text-[#17644f]" class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-[#56645c] transition-colors hover:bg-[#f1f4f0]">Register model</a>
			<span class="hidden px-3 pb-2 pt-5 text-[10px] font-semibold uppercase tracking-[0.12em] text-[#89958e] lg:block">Operations</span>
			<a routerLink="/deployments/list" routerLinkActive="bg-[#eaf1ec] text-[#17644f]" class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-[#56645c] transition-colors hover:bg-[#f1f4f0]">Deployments</a>
			<a routerLink="/deployment/register" routerLinkActive="bg-[#eaf1ec] text-[#17644f]" class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-[#56645c] transition-colors hover:bg-[#f1f4f0]">New deployment</a>
			<a routerLink="/metrics" routerLinkActive="bg-[#eaf1ec] text-[#17644f]" class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-[#56645c] transition-colors hover:bg-[#f1f4f0]">Monitoring</a>
		</nav>

		<div class="hidden border-t border-[#e8ece8] px-5 py-4 text-xs text-[#7c8981] lg:block">
			<span class="mb-2 block font-semibold text-[#526058]">WORKSPACE</span>
			Plant Operations · G12
		</div>
	</aside>

	<main class="min-w-0">
		<header class="flex min-h-18 items-center justify-between gap-4 border-b border-[#dce3dc] bg-white px-5 sm:px-8">
			<p class="text-xs font-medium text-[#718078]">Plant Operations <span class="px-1 text-[#b2bbb4]">/</span> Model lifecycle</p>
			<div class="flex items-center gap-2">
				<span class="hidden items-center gap-2 rounded-full border px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.08em] sm:inline-flex" [class.border-[#c4d9cc]]="apiStatus() === 'API connected'" [class.bg-[#eaf1ec]]="apiStatus() === 'API connected'" [class.text-[#17644f]]="apiStatus() === 'API connected'" [class.border-[#ead9ba]]="apiStatus() !== 'API connected'" [class.bg-[#fbf6e9]]="apiStatus() !== 'API connected'" [class.text-[#8a6524]]="apiStatus() !== 'API connected'">
					<span class="size-1.5 rounded-full bg-current"></span>{{ apiStatus() }}
				</span>
				<details class="relative">
					<summary class="flex min-h-9 cursor-pointer list-none items-center rounded-md border border-[#d7dfd8] px-3 text-xs font-semibold text-[#526058] hover:bg-[#f1f4f0]">Access token</summary>
					<form (submit)="saveToken($event)" class="absolute right-0 z-20 mt-2 w-[min(19rem,calc(100vw-2.5rem))] rounded-md border border-[#dce3dc] bg-white p-4 shadow-lg">
						<label for="access-token" class="grid gap-2 text-xs font-semibold text-[#526058]">Bearer token
							<input id="access-token" type="password" autocomplete="off" [value]="tokenInput()" (input)="updateToken($event)" placeholder="Paste JWT" class="h-10 rounded-md border border-[#d7dfd8] px-3 text-sm font-normal outline-none focus:border-[#17644f] focus:ring-2 focus:ring-[#17644f]/15" />
						</label>
						@if (tokenMessage()) { <p role="status" class="mt-2 text-[11px] text-[#718078]">{{ tokenMessage() }}</p> }
						<div class="mt-3 flex justify-end gap-2">
							  <button type="button" (click)="clearToken()" class="min-h-8 rounded px-2 text-xs font-semibold text-[#718078] hover:bg-[#f1f4f0]">Clear</button>
							<button type="submit" class="min-h-8 rounded bg-[#17644f] px-3 text-xs font-semibold text-white hover:bg-[#10523f]">Use token</button>
						</div>
					</form>
				</details>
			</div>
		</header>

		<div class="mx-auto w-full max-w-360 px-5 py-7 sm:px-8 sm:py-9">
			<router-outlet></router-outlet>
		</div>
	</main>
</div>
